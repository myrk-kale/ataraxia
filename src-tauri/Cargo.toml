[package]
name = "ataraxia-ide"
version = "0.4.0"
description = "Desktop environment for agent-assisted software development: chat with coding agents, review what they wrote, keep decisions and flows"
authors = ["Kale"]
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/myrk-kale/ataraxia"
homepage = "https://github.com/myrk-kale/ataraxia#readme"
readme = "../README.md"
keywords = ["tauri", "code-review", "ai-agents", "desktop", "developer-tools"]
categories = ["development-tools"]
# What a published crate carries: the sources and the built interface (src-tauri/web, made by
# `pnpm build`), but not the tests, the generated schemas or the build output.
include = [
  "/src/**",
  "/migrations/**",
  "/guide/**",
  "/icons/**",
  "/capabilities/**",
  "/web/**",
  "/build.rs",
  "/tauri.conf.json",
  "/LICENSE",
]

# The package is `ataraxia-ide` on crates.io (`ataraxia` belongs to another project), but the binary
# is `ataraxia`: it is what the installers put on the path, and `ataraxia --version` is what the
# release smoke test runs.
[[bin]]
name = "ataraxia"
path = "src/main.rs"

[features]
# Tauri serves the built interface from the binary instead of a dev server. `tauri build` turns it
# on; with `cargo install` it has to be asked for.
custom-protocol = ["tauri/custom-protocol"]

# Prebuilt binaries for `cargo binstall`, from the GitHub release of the same version.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/ataraxia-v{ version }-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/ataraxia-v{ version }-universal-apple-darwin.tar.gz"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/ataraxia-v{ version }-universal-apple-darwin.tar.gz"

[lib]
name = "ataraxia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
base64 = "0.23.1"
parking_lot = "0.12.5"
portable-pty = "0.9.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-opener = "2"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
tree-sitter = "0.26.13"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
pretty_assertions = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
