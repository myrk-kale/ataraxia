name: crates.io

# Publishes the crate (ataraxia-ide; its binary is `ataraxia`) for a released tag. The built
# interface goes inside the crate (src-tauri/web), so `cargo install` needs no Node.
#
# Today it signs in with the CARGO_REGISTRY_TOKEN secret. To move to Trusted Publishing, with no
# long-lived secret:
#   1. On crates.io, open the crate's Settings > Trusted Publishing and add this repository and
#      this workflow file (crates.yml).
#   2. In this file, uncomment the "Authenticate with crates.io (OIDC)" step, and in the publish
#      step use `steps.auth.outputs.token` instead of the secret.
#   3. Delete the CARGO_REGISTRY_TOKEN secret, and revoke the token on crates.io.
# It has to be its own workflow, not a reusable one, for crates.io to trust it, which is why the
# release workflow dispatches it.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. v0.1.0)
        required: true

permissions:
  contents: read
  # Trusted Publishing needs the OIDC token.
  # id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install the Linux libraries (cargo builds the crate to verify it)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl wget file pkg-config \
            libxdo-dev libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Check tag matches Cargo.toml
        run: |
          version="$(cargo metadata --no-deps --format-version 1 --manifest-path src-tauri/Cargo.toml | jq -r '.packages[0].version')"
          test "v${version}" = "${{ inputs.tag }}"

      - name: Build the interface that goes inside the crate
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          test -f src-tauri/web/index.html

      # - name: Authenticate with crates.io (OIDC)
      #   id: auth
      #   uses: rust-lang/crates-io-auth-action@v1

      - name: Publish (skips if this version is already on crates.io)
        working-directory: src-tauri
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          # CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          name="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].name')"
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if curl -fsS -A "ataraxia-release (github.com/myrk-kale/ataraxia)" \
               "https://crates.io/api/v1/crates/${name}/${version}" >/dev/null 2>&1; then
            echo "${name} ${version} already published"
            exit 0
          fi
          # The interface (src-tauri/web) is built here and ignored by git, and cargo counts an
          # ignored file that goes into the package as a change. Nothing else differs from the tag.
          cargo publish --locked --allow-dirty
