name: crates.io

# Publishes the crate (ataraxia-ide; its binary is `ataraxia`) for a released tag. The built
# interface goes inside the crate (src-tauri/web), so `cargo install` needs no Node.
#
# It signs in with Trusted Publishing: GitHub's OIDC token is exchanged for a short-lived crates.io
# token limited to this crate, so no long-lived secret is stored. crates.io trusts this repository
# (myrk-kale/ataraxia) and this workflow file (crates.yml). It has to be its own workflow, not a
# reusable one, for crates.io to trust it, which is why the release workflow dispatches it.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. v0.1.0)
        required: true

permissions:
  contents: read
  # Trusted Publishing needs the OIDC token.
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install the Linux libraries (cargo builds the crate to verify it)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl wget file pkg-config \
            libxdo-dev libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Check tag matches Cargo.toml
        run: |
          version="$(cargo metadata --no-deps --format-version 1 --manifest-path src-tauri/Cargo.toml | jq -r '.packages[0].version')"
          test "v${version}" = "${{ inputs.tag }}"

      - name: Build the interface that goes inside the crate
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          test -f src-tauri/web/index.html

      # Authenticate first, even when the version is already published, so a manual run against an
      # existing tag verifies the Trusted Publishing setup.
      - name: Authenticate with crates.io (OIDC)
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish (skips if this version is already on crates.io)
        working-directory: src-tauri
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          name="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].name')"
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if curl -fsS -A "ataraxia-release (github.com/myrk-kale/ataraxia)" \
               "https://crates.io/api/v1/crates/${name}/${version}" >/dev/null 2>&1; then
            echo "${name} ${version} already published"
            exit 0
          fi
          # The interface (src-tauri/web) is built here and ignored by git, and cargo counts an
          # ignored file that goes into the package as a change; nothing else differs from the tag.
          #
          # cargo's own check builds the package and then fails when Tauri's build script writes its
          # schemas (gen/) next to the sources. So the package is made without that check and
          # checked the same way, by unpacking it and building it as a user of the crate would.
          cargo package --locked --allow-dirty --no-verify
          mkdir -p "$RUNNER_TEMP/crate"
          tar -xzf "target/package/${name}-${version}.crate" -C "$RUNNER_TEMP/crate"
          (cd "$RUNNER_TEMP/crate/${name}-${version}" && cargo check --locked)
          cargo publish --locked --allow-dirty --no-verify
