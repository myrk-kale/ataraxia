name: Homebrew

# Publishes Formula/ataraxia.rb (the binary: macOS and Linux) and Casks/ataraxia.rb (the macOS app,
# which brew puts in Applications) to myrk-kale/homebrew-tap for a released version, after
# installing them. Called by the release workflow (a release made with
# GITHUB_TOKEN does not trigger `release` events), and can be run by hand for any existing tag.
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      HOMEBREW_TAP_DEPLOY_KEY:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. v0.1.0)
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag }}

jobs:
  render:
    name: Render the formula and the cask
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # The scripts come from the commit this workflow runs at: run by hand on main, a fix there
      # applies to a release that already exists.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Render from the release checksums
        run: |
          version="${TAG#v}"
          sha() {
            file="ataraxia-${TAG}-$1"
            gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "${file}.sha256" -D checksums --clobber
            cut -d' ' -f1 "checksums/${file}.sha256"
          }
          mkdir -p tap/Formula tap/Casks
          packaging/render.sh formula "$version" \
            "$(sha universal-apple-darwin.tar.gz)" \
            "$(sha x86_64-unknown-linux-gnu.tar.gz)" \
            "$(sha aarch64-unknown-linux-gnu.tar.gz)" > tap/Formula/ataraxia.rb
          packaging/render.sh cask "$version" "$(sha universal-apple-darwin.app.tar.gz)" > tap/Casks/ataraxia.rb
          cat tap/Formula/ataraxia.rb tap/Casks/ataraxia.rb
      - uses: actions/upload-artifact@v4
        with:
          name: tap-files
          path: tap
          if-no-files-found: error

  verify-macos:
    name: Install on macOS
    needs: render
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: tap-files
          path: tap
      - name: Audit, install and test the formula
        run: |
          brew tap-new --no-git local/verify >/dev/null
          # Recent Homebrew refuses to load a formula from a tap it does not trust.
          brew trust local/verify
          cp tap/Formula/ataraxia.rb "$(brew --repository local/verify)/Formula/"
          brew audit --strict --online local/verify/ataraxia
          brew install local/verify/ataraxia
          brew test local/verify/ataraxia
      - name: Install the cask and run the app's binary
        # The formula and the cask have the same name, so the formula goes first.
        run: |
          brew uninstall local/verify/ataraxia
          mkdir -p "$(brew --repository local/verify)/Casks"
          cp tap/Casks/ataraxia.rb "$(brew --repository local/verify)/Casks/"
          brew audit --cask --online local/verify/ataraxia || echo "(the cask audit is advisory)"
          brew install --cask local/verify/ataraxia
          test -d /Applications/Ataraxia.app
          scripts/smoke-binary.sh /Applications/Ataraxia.app/Contents/MacOS/ataraxia
          if xattr /Applications/Ataraxia.app | grep -q com.apple.quarantine; then
            echo "the app is still quarantined"
            exit 1
          fi

  verify-linux:
    name: Install on Linux
    needs: render
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tap-files
          path: tap
      - name: The libraries the window needs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-0 libgtk-3-0
      - name: Install and test the formula
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew tap-new --no-git local/verify >/dev/null
          # Older Homebrew has no `brew trust` and does not need it.
          brew trust local/verify || true
          cp tap/Formula/ataraxia.rb "$(brew --repository local/verify)/Formula/"
          brew install local/verify/ataraxia
          brew test local/verify/ataraxia

  publish:
    name: Push to the tap
    needs: [verify-macos, verify-linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tap-files
          path: rendered
      - uses: actions/checkout@v4
        with:
          repository: myrk-kale/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap
      - name: Commit the formula and the cask
        run: |
          mkdir -p tap/Formula tap/Casks
          cp rendered/Formula/ataraxia.rb tap/Formula/ataraxia.rb
          cp rendered/Casks/ataraxia.rb tap/Casks/ataraxia.rb
          cd tap
          git config user.name "ataraxia release bot"
          git config user.email "ataraxia-release@users.noreply.github.com"
          git add Formula/ataraxia.rb Casks/ataraxia.rb
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "ataraxia ${TAG#v}"
          git push
